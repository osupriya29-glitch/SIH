services:
  db:
    image: postgis/postgis:16-3.4
    container_name: orca_postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: marine_db
      POSTGRES_USER: marine
      POSTGRES_PASSWORD: marine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marine -d marine_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
