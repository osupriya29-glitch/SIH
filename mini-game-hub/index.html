<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Game Hub | 10 Games, 10 Challenges</title>
  <meta name="description" content="An indie game launcher featuring 10 unique, fully playable mini-games built with vanilla HTML, CSS, and JavaScript.">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/games.css">
</head>
<body>
  <div id="app-container">
    <!-- Global Header -->
    <header class="app-header">
      <div class="brand-logo" id="brand-link" title="Return to Home">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
          <polyline points="2 17 12 22 22 17"></polyline>
          <polyline points="2 12 12 17 22 12"></polyline>
        </svg>
        <span class="brand-text">Mini Game Hub</span>
      </div>

      <div class="header-actions">
        <button class="btn-icon" id="btn-toggle-sound" title="Toggle Sound FX" aria-label="Toggle Sound Effects">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- VIEW 1: HOME -->
    <main id="view-home" class="view-screen active">
      <section class="home-hero">
        <div class="hero-badge">Indie Arcade Launcher</div>
        <h1 class="hero-title">Mini Game Hub</h1>
        <p class="hero-subtitle">10 games. 10 challenges. Pure arcade and tactical puzzle mastery.</p>

        <button class="btn-primary-launch" id="btn-explore">
          <span>EXPLORE GAMES</span>
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>

        <!-- Stats Overview -->
        <div class="home-stats-grid">
          <div class="stat-pill">
            <div class="stat-value" id="stat-total-plays">0</div>
            <div class="stat-label">Total Plays</div>
          </div>
          <div class="stat-pill">
            <div class="stat-value" id="stat-completed">0</div>
            <div class="stat-label">Games Completed</div>
          </div>
          <div class="stat-pill">
            <div class="stat-value" id="stat-highest-score">0000</div>
            <div class="stat-label">Highest Score</div>
          </div>
        </div>
      </section>
    </main>

    <!-- VIEW 2: GAME HUB -->
    <section id="view-hub" class="view-screen">
      <div class="hub-header">
        <div class="hub-title-row">
          <h2 class="hub-title">Game Library</h2>
          <span class="hub-subtitle">Select a challenge to begin</span>
        </div>
      </div>

      <!-- 10 Game Cards Grid -->
      <div class="games-grid" id="games-grid">
        <!-- Rendered dynamically by app.js -->
      </div>
    </section>

    <!-- VIEW 3: GAME SCREEN -->
    <section id="view-game" class="view-screen">
      <div class="game-screen-wrapper">
        <!-- Top bar: Back & Title -->
        <div class="game-top-bar">
          <button class="btn-back" id="btn-game-back">
            <span>←</span> BACK
          </button>
          <h2 class="active-game-title" id="hud-game-title">GAME NAME</h2>
          <div style="width: 70px;"></div> <!-- balance spacing -->
        </div>

        <!-- Consistent HUD Stats Bar -->
        <div class="game-hud-bar">
          <div class="hud-item">
            <span class="hud-item-label">Score</span>
            <span class="hud-item-val" id="hud-score">0000</span>
          </div>
          <div class="hud-item">
            <span class="hud-item-label">Best</span>
            <span class="hud-item-val" id="hud-best">0000</span>
          </div>
          <div class="hud-item">
            <span class="hud-item-label">Level</span>
            <span class="hud-item-val" id="hud-level">1</span>
          </div>
          <div class="hud-item">
            <span class="hud-item-label">Time</span>
            <span class="hud-item-val" id="hud-time">00:30</span>
          </div>
        </div>

        <!-- Dynamic Game Mount Container -->
        <div id="game-area">
          <!-- Game modules inject canvas/DOM here -->
        </div>

        <!-- Bottom Controls -->
        <div class="game-bottom-bar">
          <button class="btn-ctrl btn-restart" id="btn-restart-game">RESTART</button>
          <button class="btn-ctrl btn-exit" id="btn-exit-game">EXIT</button>
        </div>
      </div>
    </section>
  </div>

  <!-- Reusable Modal (Game Over / Victory / Solution) -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-card" id="modal-content">
      <!-- Injected dynamically by app.js -->
    </div>
  </div>

  <!-- JavaScript Modules in Dependency Order -->
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>

  <!-- 10 Independent Games -->
  <script src="js/games/memoryHacker.js"></script>
  <script src="js/games/fakeOrReal.js"></script>
  <script src="js/games/whoIsLying.js"></script>
  <script src="js/games/bombDefusal.js"></script>
  <script src="js/games/trafficController.js"></script>
  <script src="js/games/virusEvolution.js"></script>
  <script src="js/games/bankHeist.js"></script>
  <script src="js/games/rescueIsland.js"></script>
  <script src="js/games/robotArena.js"></script>
  <script src="js/games/timeLoop.js"></script>

  <!-- Main App Controller -->
  <script src="js/app.js"></script>
</body>
</html>
